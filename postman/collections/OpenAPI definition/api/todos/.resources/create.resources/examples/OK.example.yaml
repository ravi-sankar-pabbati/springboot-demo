$kind: http-example
request:
  url: "{{baseUrl}}/api/todos"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "title": "string",
        "description": "string",
        "completed": true,
        "dueDate": "1970-02-10"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "id": 9109,
        "title": "string",
        "description": "string",
        "completed": false,
        "dueDate": "1950-01-20"
      }
order: 1000
