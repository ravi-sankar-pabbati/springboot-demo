$kind: http-example
request:
  url: "{{baseUrl}}/hello/config/properties"
  method: GET
  headers:
    Accept: "*/*"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "name": "string",
        "maxGreetings": 1371
      }
order: 1000
