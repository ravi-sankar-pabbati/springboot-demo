spring.application.name=springboot-demo

# Keep framework and JVM logs at INFO; enable DEBUG for application code only.
logging.level.root=INFO
logging.level.com.example=${APP_LOG_LEVEL:DEBUG}
# Uncomment to enable structured JSON console logging.
# logging.structured.format.console=ecs

# Local request tracing: correlate logs without sending telemetry to a collector.
management.tracing.propagation.type=W3C
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

# Custom properties for the @Value and @ConfigurationProperties examples.
app.name=Greeting Demo
app.max-greetings=5

# Local PostgreSQL. Set DB_PASSWORD if password authentication is enabled.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USERNAME:ravisankarpabbati}
spring.datasource.password=${DB_PASSWORD:}
# Flyway manages schema changes; Hibernate verifies the entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
