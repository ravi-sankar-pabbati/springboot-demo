spring.application.name=springboot-demo

# Custom properties for the @Value and @ConfigurationProperties examples.
app.name=Greeting Demo
app.max-greetings=5

# Local PostgreSQL. Set DB_PASSWORD if password authentication is enabled.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USERNAME:ravisankarpabbati}
spring.datasource.password=${DB_PASSWORD:}
# Flyway manages schema changes; Hibernate verifies the entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
